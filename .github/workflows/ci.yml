name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin UI
        run: npm run build

      - name: Save built admin UI
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: admin-ui-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
